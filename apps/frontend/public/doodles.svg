<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <g fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 1. فقاعة محادثة (Chat Bubble) -->
    <g transform="translate(30, 20) rotate(-10)">
      <path d="M 0 0 h 24 a 8 8 0 0 1 8 8 v 10 a 8 8 0 0 1 -8 8 h -10 l -6 6 v -6 h -4 a 8 8 0 0 1 -8 -8 v -10 a 8 8 0 0 1 8 -8" />
    </g>

    <!-- 2. قلب (Heart) -->
    <g transform="translate(180, 25) rotate(15)">
      <path d="M 0 0 c -4 -6 -12 -6 -16 0 c -4 -6 -12 -6 -16 0 c -4 6 0 14 16 22 c 16 -8 20 -16 16 -22 Z" />
    </g>

    <!-- 3. كاميرا (Camera) -->
    <g transform="translate(270, 30) rotate(-5)">
      <path d="M 0 0 h 22 v 15 h -22 z M 5 0 v -3 h 12 v 3" />
      <circle cx="11" cy="7.5" r="3.5" />
    </g>

    <!-- 4. وجه مبتسم (Smile Face) -->
    <g transform="translate(110, 80) rotate(8)">
      <circle cx="0" cy="0" r="11" />
      <path d="M -5 3 q 5 4 10 0" />
      <circle cx="-4" cy="-3" r="1" fill="#000000" />
      <circle cx="4" cy="-3" r="1" fill="#000000" />
    </g>

    <!-- 5. ميكروفون (Microphone) -->
    <g transform="translate(220, 100) rotate(-20)">
      <rect x="-4" y="-8" width="8" height="12" rx="4" />
      <path d="M -7 -2 a 7 7 0 0 0 14 0 M 0 5 v 5 M -4 10 h 8" />
    </g>

    <!-- 6. طائرة ورقية / إرسال (Paper Airplane) -->
    <g transform="translate(30, 120) rotate(12)">
      <path d="M 0 0 l 20 -10 l -10 20 l -3 -7 l -7 -3 Z M 10 10 l -3 -7" />
    </g>

    <!-- 7. جرس إشعارات (Bell) -->
    <g transform="translate(160, 160) rotate(-8)">
      <path d="M 0 0 a 6 6 0 0 1 6 -6 h 0 a 6 6 0 0 1 6 6 v 6 l 2 2 h -16 l 2 -2 Z M 4 12 a 2 2 0 0 0 4 0" />
    </g>

    <!-- 8. نوتة موسيقية (Music Note) -->
    <g transform="translate(280, 180) rotate(25)">
      <path d="M 0 0 v 14 M 0 0 l 10 -3 v 14" />
      <circle cx="-3" cy="14" r="3" />
      <circle cx="7" cy="11" r="3" />
    </g>

    <!-- 9. قفل حماية (Lock) -->
    <g transform="translate(70, 200) rotate(-15)">
      <rect x="0" y="0" width="14" height="11" rx="2" />
      <path d="M 3 0 v -4 a 4 4 0 0 1 8 0 v 4" />
    </g>

    <!-- 10. نجمة (Star) -->
    <g transform="translate(230, 240) rotate(10)">
      <path d="M 0 -8 l 2 5 l 6 1 l -4 4 l 1 6 l -5 -3 l -5 3 l 1 -6 l -4 -4 l 6 -1 Z" />
    </g>

    <!-- 11. دبوس موقع (Location Pin) -->
    <g transform="translate(20, 260) rotate(5)">
      <path d="M 0 0 a 7 7 0 0 1 14 0 c 0 7 -7 13 -7 13 s -7 -6 -7 -13 Z" />
      <circle cx="7" cy="0" r="2.5" />
    </g>

    <!-- 12. دبوس ورقي / مرفقات (Paperclip) -->
    <g transform="translate(130, 270) rotate(-45)">
      <path d="M 0 0 v 10 a 4 4 0 0 0 8 0 v -12 a 6 6 0 0 0 -12 0 v 12" />
    </g>

    <!-- 13. فنجان قهوة (Coffee Cup) -->
    <g transform="translate(280, 280) rotate(-10)">
      <path d="M 0 0 h 14 v 10 a 5 5 0 0 1 -5 5 h -4 a 5 5 0 0 1 -5 -5 Z M 14 2 h 3 a 2 2 0 0 1 0 4 h -3" />
    </g>

    <!-- 14. سماعة هاتف (Phone Handset) -->
    <g transform="translate(110, 10) rotate(40)">
      <path d="M 0 0 a 8 8 0 0 1 8 8 v 4 a 4 4 0 0 1 -4 4 h -2 a 8 8 0 0 1 -8 -8 v -2 a 4 4 0 0 1 4 -4 Z" />
    </g>

    <!-- 15. عدسة مكبرة / بحث (Search) -->
    <g transform="translate(200, 180) rotate(-30)">
      <circle cx="0" cy="0" r="6" />
      <path d="M 4 4 l 6 6" />
    </g>

    <!-- 16. بروق / صاعقة (Lightning) -->
    <g transform="translate(170, 90) rotate(15)">
      <path d="M 0 0 l -4 7 h 5 l -2 7 l 8 -9 h -5 Z" />
    </g>

    <!-- 17. شمس / طقس (Sun) -->
    <g transform="translate(20, 180)">
      <circle cx="0" cy="0" r="5" />
      <path d="M 0 -8 v 2 M 0 6 v 2 M -8 0 h 2 M 6 0 h 2 M -5 -5 l 1.5 1.5 M 4 4 l 1.5 1.5 M -5 5 l 1.5 -1.5 M 4 -4 l 1.5 -1.5" />
    </g>

    <!-- 18. يد ألعاب (Game Controller) -->
    <g transform="translate(90, 130) rotate(-12)">
      <rect x="-8" y="-5" width="16" height="10" rx="4" />
      <path d="M -5 0 h 3 M -3.5 -1.5 v 3 M 4 -1 h .01 M 5 1 h .01" />
    </g>

  </g>
</svg>
